{{- if .Values.bridgeSecrets.enabled }}
{{- /*
Generate-once bridge secrets, GitOps-safe.

The core (Fernet dbEncryptionKey + service/signing/userAuth keys, litellm master
key) and S3 secrets hold RANDOM material that must never change after the first
install — rotating dbEncryptionKey orphans every DB-encrypted credential. A pure
Helm template cannot preserve that: `lookup` is blind under `helm template`
(Argo CD), so the random branch re-rolls on every sync.

This Job resolves it imperatively: it reads the live cluster at run time and
creates each secret ONLY if absent, so re-running it (every Argo sync) is a
no-op once the secrets exist. The secrets are created by kubectl — NOT rendered
into the Helm manifest — so neither Helm nor Argo tracks, diffs, prunes or
overwrites them. `bridgeSecrets.values.*`, when set, pin the values instead of
generating (useful for BYO deterministic creds); leaving them empty is now safe
under Argo. The deterministic redis URL secret stays a plain template resource
(see bridge-secrets.yaml) — it has no random content to preserve.

To CHANGE a bridge secret after install, delete it (or switch to
bridgeSecrets.enabled=false + secrets.existingSecret / External Secrets); the
Job never mutates an existing secret.
*/}}
{{- $g := .Values.bridgeSecrets.generator }}
{{- $saName := $g.serviceAccountName | default (printf "%s-secret-generator" (include "tracecat.fullname" .)) }}
{{- $hookAnnotations := dict
      "helm.sh/hook" "pre-install,pre-upgrade"
      "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
{{- if $g.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "tracecat.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "-6"
    argocd.argoproj.io/sync-wave: "-6"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  labels:
    {{- include "tracecat.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "-6"
    argocd.argoproj.io/sync-wave: "-6"
rules:
  # Scoped to this namespace, and to get/create only — never update/delete, so
  # the Job can never mutate or remove an existing secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  labels:
    {{- include "tracecat.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "-6"
    argocd.argoproj.io/sync-wave: "-6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tracecat.fullname" . }}-secret-generator
  labels:
    {{- include "tracecat.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-generator
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
    helm.sh/hook-weight: "-5"
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "tracecat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-generator
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $saName }}
      # This Job is the one chart workload that talks to the Kubernetes API, so —
      # unlike every other pod — it mounts its SA token.
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.scheduling .Values.scheduling.architecture }}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.scheduling.architecture }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: secret-generator
          image: {{ include "tracecat.secretGeneratorImage" . | quote }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          {{- include "tracecat.containerSecurityContext" . | nindent 10 }}
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              ns="$NAMESPACE"

              # Fernet key: 32 random bytes, url-safe base64 (matches
              # cryptography.fernet.Fernet.generate_key()).
              gen_fernet() { head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '\n'; }
              # N random bytes as lowercase hex (matches `openssl rand -hex N`).
              gen_hex() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }

              mark() {
                name="$1"; component="$2"
                {{- if .Values.bridgeSecrets.retain }}
                kubectl -n "$ns" annotate secret "$name" helm.sh/resource-policy=keep --overwrite
                {{- end }}
                # Descriptive labels only — deliberately NOT app.kubernetes.io/managed-by=Helm
                # and no Argo tracking label, so neither controller adopts, diffs or prunes it.
                kubectl -n "$ns" label secret "$name" \
                  app.kubernetes.io/name={{ include "tracecat.name" . }} \
                  app.kubernetes.io/instance={{ .Release.Name }} \
                  app.kubernetes.io/managed-by=tracecat-secret-generator \
                  app.kubernetes.io/component="$component" --overwrite
              }

              if kubectl -n "$ns" get secret "$CORE_NAME" >/dev/null 2>&1; then
                echo "core secret '$CORE_NAME' already exists — leaving untouched"
              else
                echo "creating core secret '$CORE_NAME'"
                kubectl -n "$ns" create secret generic "$CORE_NAME" \
                  --from-literal=dbEncryptionKey="${IN_DB_ENCRYPTION_KEY:-$(gen_fernet)}" \
                  --from-literal=serviceKey="${IN_SERVICE_KEY:-$(gen_hex 32)}" \
                  --from-literal=signingSecret="${IN_SIGNING_SECRET:-$(gen_hex 32)}" \
                  --from-literal=userAuthSecret="${IN_USER_AUTH_SECRET:-$(gen_hex 32)}" \
                  --from-literal=litellmMasterKey="${IN_LITELLM_MASTER_KEY:-sk-$(gen_hex 24)}"
                mark "$CORE_NAME" secrets
              fi

              if kubectl -n "$ns" get secret "$S3_NAME" >/dev/null 2>&1; then
                echo "s3 secret '$S3_NAME' already exists — leaving untouched"
              else
                echo "creating s3 secret '$S3_NAME'"
                ak="${IN_S3_ACCESS_KEY_ID:-tracecat-$(gen_hex 8)}"
                sk="${IN_S3_SECRET_ACCESS_KEY:-$(gen_hex 20)}"
                kubectl -n "$ns" create secret generic "$S3_NAME" \
                  --from-literal=accessKeyId="$ak" \
                  --from-literal=secretAccessKey="$sk" \
                  --from-literal=RUSTFS_ACCESS_KEY="$ak" \
                  --from-literal=RUSTFS_SECRET_KEY="$sk"
                mark "$S3_NAME" s3
              fi

              echo "bridge secret generation complete"
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CORE_NAME
              value: {{ .Values.bridgeSecrets.coreSecretName | quote }}
            - name: S3_NAME
              value: {{ .Values.bridgeSecrets.s3SecretName | quote }}
            {{- $v := .Values.bridgeSecrets.values | default dict }}
            {{- with $v.dbEncryptionKey }}
            - name: IN_DB_ENCRYPTION_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.serviceKey }}
            - name: IN_SERVICE_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.signingSecret }}
            - name: IN_SIGNING_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.userAuthSecret }}
            - name: IN_USER_AUTH_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.litellmMasterKey }}
            - name: IN_LITELLM_MASTER_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.s3AccessKeyId }}
            - name: IN_S3_ACCESS_KEY_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with $v.s3SecretAccessKey }}
            - name: IN_S3_SECRET_ACCESS_KEY
              value: {{ . | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
