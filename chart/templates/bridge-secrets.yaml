{{- if .Values.bridgeSecrets.enabled }}
{{- /*
Bridge secret with DETERMINISTIC content only: the REDIS_URL for the bundled
CloudPirates redis (derived from the service name + port, auth disabled). Being
a pure function of values it is safe to render on every sync — no `lookup`, no
random — so it stays a normal templated resource and updates correctly if the
redis service/port changes.

The secrets that hold RANDOM material (core Fernet/keys, S3 creds) are created
imperatively by the generate-once Job in bridge-secrets-generator.yaml, so they
survive Argo CD syncs without re-rolling. Disable this whole block
(bridgeSecrets.enabled=false) when supplying secrets via secrets.existingSecret
/ External Secrets Operator instead.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bridgeSecrets.redisSecretName }}
  {{- if .Values.bridgeSecrets.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "tracecat.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  # REDIS_URL for the bundled CloudPirates redis (auth disabled).
  url: {{ printf "redis://%s:%v" (include "tracecat.redisServiceName" .) .Values.bridgeSecrets.redisPort | quote }}
{{- end }}
